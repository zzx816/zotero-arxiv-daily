# GZSL 组件价值评分 v2；分项独立判断，缺失证据不等于无价值。
research_directions:
  - "主线：水声船舶辐射噪声广义零样本分类，包括未见类语义分类与 seen/unseen 联合决策。"
  - "主动关注 OSR/OOD：已见/未见门控、置信度和偏置校准；无需独立完成未见类命名，但必须有可迁移组件。"
  - "未见类原型 V(U) 修正、语义对齐、特征生成、无标签样本筛选与伪标签污染控制。"
  - "少样本、音频文本对齐、类别语义构建及跨域鲁棒性；优先有 DeepShip/ShipsEar 等水声验证的工作。"

judgment_criteria:
  - "明确论文解决哪个 GZSL 环节。完整分类方法与局部门控/校准/原型组件均可获得高相关度，不因缺少完整分类流程重复扣分。"
  - "区分新类别分类与跨人群、跨地区迁移、序列预测、轨迹生成；仅出现 zero-shot 或 OOD 不构成高相关度。"
  - "各分项独立评价。非音频方法只要具备明确的特征/分数级迁移路径，方法迁移性仍可高分。"
  - "监督要求逐项核验：已见标签、未见语义、外部 OOD、无标签测试数据及真实测试标签。普通 GZSL 不得利用真实测试未见类标签；无标签测试适应明确标注为转导式。"
  - "注意检测器可能识别的是海域、航速、设备或信噪比变化，而非未见船类。最小实验需提出对照和验证指标，如 A_S/A_U/H、门控 AUROC 或伪标签纯度。"
  - "只依据提供的摘要/TLDR。禁止假设已读全文或代码；未知资源、监督条件和方法细节写入证据缺口，不臆造。"
  - "有摘要可支持的具体组件才设 concrete_component=true；泛泛的换成 CLAP、可能借鉴不足以成立。"
  - "最高优先级仍是提升水声 GZSL；不因 OOD 热门就加分，不要求每天必须产生精读论文。"

scoring_weights:
  research_problem_score: 0.30
  method_transfer_score: 0.30
  experiment_feasibility_score: 0.20
  acoustic_modality_score: 0.10
  novelty_score: 0.10

# 每个分项使用自己的标准，不共享一个排斥纯 OOD 的低分锚点。
scoring_anchors:
  research_problem_score: "8-10：直接解决未见类分类/门控/偏置/原型/伪标签至少一项；4-7：间接相关；0-3：任务无关。"
  method_transfer_score: "8-10：有明确可接入的评分函数、损失、门控器或原型更新；4-7：需要明确改造；0-3：只有类比或不可剥离的视觉几何。"
  experiment_feasibility_score: "8-10：监督、数据和算力可满足，协议兼容；4-7：需额外资源或协议调整；0-3：关键条件不可满足。未说明则标待核验。"
  acoustic_modality_score: "8-10：已有相关音频/水声验证；4-7：音频特征适配路径清晰；0-3：模态强绑定且缺少适配路径。"
  novelty_score: "8-10：明确改动、对照基线和可检验假设；4-7：组件明确但实验待完善；0-3：只有泛泛启发。"

# 综合分不等于证据充分度；阅读建议还检查组件、协议与证据。
# 精读：>=7.5 且证据高、组件明确、协议兼容；略读：>=5.5 且组件明确。
# 强相关局部组件可进入略读；证据低或关键协议未知进入待核验。
# risk_score 单独展示，不参与加权。

gmail:
  query: 'subject:"Daily arXiv"'

papers:
  max_papers: 10

llm:
  api_base: ${oc.env:OPENAI_API_BASE,https://api.openai.com/v1}
  generation_kwargs:
    model: ${oc.env:PAPER_TRIAGE_MODEL,gpt-4o-mini}
    temperature: 0.2
    max_tokens: 2500

report:
  output_dir: reports

email_report:
  enabled: ${oc.env:PAPER_TRIAGE_SEND_EMAIL,false}
  sender: ${oc.env:SENDER,null}
  receiver: ${oc.env:RECEIVER,null}
  sender_password: ${oc.env:SENDER_PASSWORD,null}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.env:SMTP_PORT,465}
