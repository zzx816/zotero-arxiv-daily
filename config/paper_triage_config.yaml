research_directions:
  - 水下目标识别与船舶噪声分类
  - 被动声纳 / 水声信号处理
  - DeepShip / ShipsEar
  - 声谱图、Log-Mel、MFCC、LOFAR、DEMON 特征上的分类
  - 零样本学习 ZSL / 广义零样本 GZSL
  - 少样本学习 FSL / 原型学习
  - 开放集识别 OSR / 未知类拒识 / OOD 检测
  - 小样本、类别不平衡、跨域迁移、域泛化

judgment_criteria:
  - 不要只看论文是否出现 underwater / sonar。
  - 图像分类、医学影像、遥感、故障诊断、音频分类中的零样本、少样本、开放集方法，如果能替换输入模态，也可能迁移。
  - 如果方法关注类别语义、原型学习、OOD 检测、开放集、少样本分类、跨域适应、域泛化、自监督声学表征，请提高优先级。
  - 评分必须看是否存在可迁移的技术组件，例如损失函数、原型分类头、未知类阈值、特征对齐策略、语义嵌入或训练/评估协议。
  - 如果方法强依赖 RGB 图像颜色、目标检测框、像素级分割、大规模标注数据，请降低迁移可行性。
  - 如果论文主要是 LLM scaling law、数据混合、路由、agent、推理链或纯语言模型训练技巧，且不能落到声学分类实验，请给低分并建议跳过。
  - 判断是否可以把输入替换为 Log-Mel、MFCC、LOFAR、DEMON 或声谱图。

gmail:
  query: 'subject:"Daily arXiv"'

papers:
  max_papers: 5

llm:
  api_base: ${oc.env:OPENAI_API_BASE,https://api.openai.com/v1}
  generation_kwargs:
    model: ${oc.env:PAPER_TRIAGE_MODEL,gpt-4o-mini}
    temperature: 0.2
    max_tokens: 2000

report:
  output_dir: reports

email_report:
  enabled: ${oc.env:PAPER_TRIAGE_SEND_EMAIL,false}
  sender: ${oc.env:SENDER,null}
  receiver: ${oc.env:RECEIVER,null}
  sender_password: ${oc.env:SENDER_PASSWORD,null}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.env:SMTP_PORT,465}
