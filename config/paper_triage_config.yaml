research_directions:
  - 水下目标识别
  - 被动声纳
  - DeepShip / ShipsEar
  - 水下声学目标分类
  - 零样本学习 ZSL
  - 少样本学习 FSL
  - 广义零样本 GZSL
  - 开放集识别 OSR
  - 未知类拒识
  - 小样本、类别不平衡、跨域迁移

judgment_criteria:
  - 不要只看论文是否出现 underwater / sonar。
  - 图像分类、医学影像、遥感、故障诊断、音频分类中的零样本、少样本、开放集方法也可能迁移。
  - 如果方法关注类别语义、原型学习、OOD 检测、开放集、少样本分类、跨域适应，请提高优先级。
  - 如果方法强依赖 RGB 图像颜色、目标检测框、像素级分割、大规模标注数据，请降低迁移可行性。
  - 判断是否可以把输入替换为 Log-Mel、MFCC、LOFAR、DEMON 或声谱图。

gmail:
  query: 'subject:"Daily arXiv"'

papers:
  max_papers: 5

llm:
  api_base: ${oc.env:OPENAI_API_BASE,https://api.openai.com/v1}
  generation_kwargs:
    model: ${oc.env:PAPER_TRIAGE_MODEL,gpt-4o-mini}
    temperature: 0.2
    max_tokens: 2000

report:
  output_dir: reports

email_report:
  enabled: ${oc.env:PAPER_TRIAGE_SEND_EMAIL,false}
  sender: ${oc.env:SENDER,null}
  receiver: ${oc.env:RECEIVER,null}
  sender_password: ${oc.env:SENDER_PASSWORD,null}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.env:SMTP_PORT,465}
